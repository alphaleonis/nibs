version: 2

before:
  hooks:
    - go generate ./...
    - bash -c "cd web && npm ci && npm run build"
    - go-licenses save ./... --save_path=./third_party_licenses --force --ignore github.com/alphaleonis/nibs
    - bash -c "go-licenses report ./... --ignore github.com/alphaleonis/nibs > ./third_party_licenses/NOTICES.csv 2>/dev/null"

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/alphaleonis/nibs/cmd.version={{ .Tag }}

archives:
  # Version-less asset names ({project}_{os}_{arch}) so `nibs upgrade`
  # (github.com/creativeprojects/go-selfupdate) can match assets against the
  # running platform. install.sh / install.ps1 resolve the same names.
  - name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE.md
      - src: ./third_party_licenses/**/*
        dst: .
        strip_parent: false

# Single, fixed-name checksum file so go-selfupdate's ChecksumValidator
# (UniqueFilename: "checksums.txt") verifies downloads without templating.
checksum:
  name_template: "checksums.txt"

release:
  draft: true

# Do NOT set `changelog.disable: true`: the release workflow passes
# `--release-notes` (from CHANGELOG.md), which GoReleaser loads inside the
# changelog pipe. Disabling the changelog skips that pipe entirely, so the
# notes are never read and the GitHub release body comes out empty. With the
# pipe enabled and `--release-notes` set, GoReleaser uses the file verbatim and
# generates no commit changelog (early return in the changelog pipe). See
# nibs-gyj5.
