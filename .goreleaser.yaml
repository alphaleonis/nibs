version: 2

# GoReleaser only builds, archives and checksums here. It runs in release.yml's
# build job, which also runs the npm packages that `task release:prep` installs,
# so that job holds neither the signing key nor a token that can write releases.
# Later jobs sign checksums.txt and create the draft. Keep this file build-only:
# no `signs`, no publisher, and no `release` enabled.
#
# Put build steps in `task release:prep`, not in `before.hooks`. Without that
# task the Go build fails, because embed.go embeds web/dist.

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/alphaleonis/nibs/cmd.version={{ .Tag }}

archives:
  # Version-less asset names ({project}_{os}_{arch}) so `nibs upgrade`
  # (github.com/creativeprojects/go-selfupdate) can match assets against the
  # running platform. install.sh / install.ps1 resolve the same names.
  - name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE.md
      - src: ./third_party_licenses/**/*
        dst: .
        strip_parent: false

# Single, fixed-name checksum file so go-selfupdate's ChecksumValidator
# (UniqueFilename: "checksums.txt") verifies downloads without templating.
checksum:
  name_template: "checksums.txt"

# release.yml's publish job creates the GitHub release from dist/.
release:
  disable: true

# release.yml extracts the release notes from CHANGELOG.md.
changelog:
  disable: true
