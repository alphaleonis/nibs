<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nibs</title>
    <!-- Favicons. Both are served from web/public, which Vite copies to the
         root of web/dist, so they ship inside the binary via embed.go and
         cmd/spa.go serves them (.svg and .ico are both in its asset allowlist).
         The ICO is listed first and the SVG second, which is the ordering that
         lets a browser without SVG-favicon support fall back cleanly; anything
         current prefers the SVG regardless of order. The artwork is the logo
         mark WITHOUT its ring — see web/public/favicon.svg for why.
         favicon.ico is generated from the SVG by `task favicon`, not by the
         build, since rasterizing it needs a browser. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- FOUC guard (nibs-vmaq): pick the saved palette AND its light/dark class
         BEFORE first paint so the app never flashes the wrong theme. This runs
         before any module loads, so it must stay self-contained — no imports. It
         therefore duplicates FIVE things owned by the TypeScript source of truth,
         ALL of which must be kept in sync:
           1. the theme allowlist ["graphite","midnight","dracula","daylight"]
              ↔ THEMES              (src/lib/types.ts)
           2. the storage key "nibs-filter-preferences"
              ↔ STORAGE_KEY         (src/lib/storage.ts)
           3. the top-level `.theme` JSON shape
              ↔ FilterPreferences   (savePreferences in src/lib/storage.ts)
           4. the default "graphite"
              ↔ DEFAULT_THEME       (src/lib/types.ts)
           5. the dark-flag map { graphite:1, midnight:1, dracula:1, daylight:0 }
              ↔ THEMES[].dark       (src/lib/types.ts) — owns the `.dark` class,
                which app.css keys Tailwind's `dark:` variant off of, so this must
                be set before paint or light themes flash dark shadcn utilities.
         src/lib/fouc-guard.test.ts asserts all five against those constants so
         drift fails loudly. Any error here falls back to the default
         ("graphite", dark). -->
    <script>
      (function () {
        var themes = ["graphite", "midnight", "dracula", "daylight"];
        var dark = { graphite: 1, midnight: 1, dracula: 1, daylight: 0 };
        var t = "graphite";
        try {
          var raw = localStorage.getItem("nibs-filter-preferences");
          if (raw) {
            var stored = JSON.parse(raw).theme;
            if (themes.indexOf(stored) !== -1) t = stored;
          }
        } catch (e) {
          /* ignore — fall back to default */
        }
        document.documentElement.setAttribute("data-theme", t);
        document.documentElement.classList.toggle("dark", dark[t] !== 0);
      })();
    </script>
  </head>
  <body class="bg-background text-foreground antialiased">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
