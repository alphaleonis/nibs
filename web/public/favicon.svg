  <title>Nibs</title>
  <!--
    The logo mark WITHOUT its orbiting ring, on a square canvas with a 4% margin.

    The ring is dropped deliberately. It is a thin arc enclosing mostly empty
    space, and at 16px — the common tab size on a 1x display — it rasterizes
    into an orange smear that swallows the checkmark. The nib and blade alone
    are solid enough to stay legible from 16px up. See assets/logo/README.md.

    Geometry and the transform chain come from assets/logo/logo-only.svg; the
    gradients are unchanged, so this matches the mark used everywhere else.
  -->
  <g transform="matrix(1,0,0,1,-850.542,-90.487)">
    <g transform="matrix(5.95339,0,0,5.95339,-2251.08,-7988.84)">
