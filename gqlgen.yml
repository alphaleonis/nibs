# gqlgen configuration
# See https://gqlgen.com/config/ for details

schema:
  - internal/graph/*.graphqls

exec:
  filename: internal/graph/generated.go
  package: graph

model:
  filename: internal/graph/model/models_gen.go
  package: model

resolver:
  layout: follow-schema
  dir: internal/graph
  package: graph

# Autobind to existing types
autobind:
  - github.com/alphaleonis/nibs/internal/nib

models:
  # Use existing Nib type from nib package
  Nib:
    model: github.com/alphaleonis/nibs/internal/nib.Nib
    fields:
      # The stored Nib keeps Type/Priority empty when the file omits them (so the
      # etag witnesses the on-disk bytes — see nib.DefaultType). These field
      # resolvers apply the "task"/"normal" presentation defaults so the
      # non-nullable GraphQL fields always resolve a value (nibs-7d3o).
      type:
        resolver: true
      priority:
        resolver: true
  # UpdateNibInput: priority/estimate must distinguish an explicit JSON `null`
  # ("clear this field") from an omitted field ("leave unchanged"). Plain
  # *string collapses both to nil, so a clear never persists (nibs-qijw).
  # omittable wraps them in graphql.Omittable[*string]: IsSet() is true for
  # null (with a nil inner pointer) and false when omitted.
  UpdateNibInput:
    fields:
      priority:
        omittable: true
      estimate:
        omittable: true
  # Map ID scalar to string
  ID:
    model:
      - github.com/99designs/gqlgen/graphql.ID
      - github.com/99designs/gqlgen/graphql.Int
      - github.com/99designs/gqlgen/graphql.Int64
      - github.com/99designs/gqlgen/graphql.Int32
  Int:
    model:
      - github.com/99designs/gqlgen/graphql.Int
      - github.com/99designs/gqlgen/graphql.Int64
      - github.com/99designs/gqlgen/graphql.Int32
