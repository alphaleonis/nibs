name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: go generate ./...
      - run: cd web && npm ci && npm run build
      - run: go build ./...
      - run: go test -count=1 ./...
      - run: cd web && npx vitest run --reporter=default

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: go generate ./...
      - run: cd web && npm ci && npm run build
      - uses: golangci/golangci-lint-action@v9
