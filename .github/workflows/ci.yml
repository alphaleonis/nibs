name: CI

on:
  # develop carries unreleased work and is where feature branches land, so CI
  # runs there too. Without it the first CI run on any change is the merge to
  # main that releases it, and release.yml gates on that same run (nibs-9146).
  push:
    branches: [main, develop]
  # `develop` is here as well because Renovate targets it (see
  # .github/renovate.json5). Its `renovate/*` branches are not covered by the
  # push trigger above, so with `main` alone a toolchain pull request would
  # reach the merge button without CI having run on it once.
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Where internal/testskip appends its tally of guards that did not run
      # because the runner could not build their fixture. The tally is a COUNT
      # PER CAPABILITY, which is what the skip enumeration below cannot produce:
      # that step names tests, and a test name does not say which capability went
      # missing. It is also the set NIBS_REQUIRE_SYMLINKS and its siblings turn
      # into failures. Absolute, because the go tool runs each package's binary
      # with that package's own source directory as its cwd.
      NIBS_SKIP_REPORT: ${{ github.workspace }}/skipped-guards.txt
      # Where the `go test -json` event stream is teed, for the skip
      # enumeration two steps below. Relative because both steps that touch it
      # run in the workspace, which spares the windows leg the backslash-path
      # conversion NIBS_SKIP_REPORT needs.
      GO_TEST_EVENTS: go-test-events.json
      # Required on BOTH legs: a symlink skip is now a regression in the
      # environment rather than a limitation of it, whichever runner it happens
      # on. Linux always supported them. The windows leg was left permissive
      # until a run could answer whether those runners create a symlink without
      # elevation — and the tally has now answered it, reporting `hostile
      # filenames`, `named pipes` and `unreadable paths` while never once naming
      # symlinks. Fifteen fixtures depend on that capability, several of them the
      # only coverage a store-resolution refusal has, so requiring it is what
      # stops a runner image change silently taking them out of the run.
      NIBS_REQUIRE_SYMLINKS: '1'
      # Required rather than permissive: the store-walk guards that keep a FIFO
      # named `*.md` from blocking every command have no platform-independent
      # fixture beside them (a directory by that name is answered by the walk's
      # own IsDir branch and never reaches the regularity test), so a silent skip
      # here costs the whole guard rather than one spelling of it.
      NIBS_REQUIRE_NAMED_PIPES: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}
      # Ubuntu only, and unfixably so: the deception guards need a FILENAME
      # carrying control characters and bidi overrides, which POSIX accepts and
      # Windows rejects outright with ERROR_INVALID_NAME. So a skip on the linux
      # leg means the fixture stopped being built rather than that the machine
      # could not build it, and the five guards it covers are the ones proving a
      # filename cannot rewrite a message that quotes it.
      NIBS_REQUIRE_HOSTILE_FILENAMES: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}
      # Ubuntu only, and unfixably so: Windows stores no POSIX permission bits,
      # and Go synthesizes FileMode.Perm() there from the read-only attribute
      # alone, so 0666 and 0444 are the only values a fixture can produce. The
      # four guards this covers are the whole of the coverage that a rewrite of
      # <store>/config.yml does not widen a private config's mode — a change
      # that is silent at the point it happens — so a skip on the linux leg
      # means they stopped running rather than that they could not.
      NIBS_REQUIRE_POSIX_FILE_MODES: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Every tool this job runs — go, node, task — is installed by mise from
      # mise.toml, so the versions are read rather than restated. The previous
      # shape hand-copied each one into a setup-go `go-version`, a setup-node
      # `node-version` and a `go install .../task@` step; nine such copies
      # existed across this file and release.yml, and nothing cross-checked
      # them, so a bump that missed one left CI on the old pin silently
      # (nibs-23f0). mise.toml is now the only place any of these versions
      # appear.
      #
      # On Windows mise works through shims rather than shell activation, which
      # is what `add_shims_to_path` (default true) provides — so `go`, `node`
      # and `task` resolve on both matrix legs without a $GITHUB_PATH step.
      #
      # github_token is not optional in practice: mise resolves these tools from
      # GitHub releases, and the action warns that unauthenticated runs can hit
      # the API rate limit. The token is the job's own read-only one.
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      # mise-action caches the tools it installs, not Go's module and build
      # caches — setup-go used to supply those, so without this the change
      # would trade the version drift for a cold Go cache on every run. Paths
      # come from `go env` because GOMODCACHE and GOCACHE differ per OS and
      # this job is a two-OS matrix.
      - name: Locate Go caches
        id: go-cache
        shell: bash
        run: |
          mod="$(go env GOMODCACHE)"
          build="$(go env GOCACHE)"
          echo "mod=$mod" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

          # Make anything already in those directories writable, or the restore
          # below fails with `/usr/bin/tar ... exit code 2`.
          #
          # mise.toml pins two tools through mise's `go:` backend (go-licenses,
          # govulncheck), and mise installs those by running `go install` — which
          # populates GOMODCACHE with files Go deliberately creates read-only
          # (0444). mise-action runs BEFORE this step, so on a mise cache MISS
          # the module cache is already non-empty and read-only by the time
          # actions/cache untars over it.
          #
          # That is why the failure is intermittent: on a mise cache HIT nothing
          # is installed, the directories are empty, and the restore succeeds.
          # The restore failing is not fatal — it warns and continues — so the
          # only symptom is a silently cold Go cache, which is the entire point
          # of this step.
          chmod -R u+w "$mod" "$build" 2>/dev/null || true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-cache.outputs.mod }}
            ${{ steps.go-cache.outputs.build }}
          key: go-${{ matrix.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ matrix.os }}-
      # The web build runs through Task so the web:install gate executes on
      # every CI run instead of being bypassed by a hand-written `npm ci`
      # (nibs-9146). `task web:build` is web:install → go:codegen (which is
      # `go generate ./...`) → `npm run build`, so it replaces both steps.
      # A runner is always fresh, so this is the cold-install path only.
      - run: task web:build
      # The Go steps stay direct instead of going through `task test`, which is
      # not equivalent to this job: it runs -race on every OS (see below), runs
      # web:check (the lint job owns that), and shells out to
      # scripts/go-test-capped.sh, which needs bash and degrades to an uncapped
      # run wherever there is no user systemd manager.
      - run: go build ./...
      # -shuffle=on costs nothing here (-count=1 already defeats the cache) and
      # this is the lane that blocks a merge, so the order-dependence guard runs
      # where it can stop a regression rather than only on whichever developer
      # draws an unlucky seed (nibs-ni02). The seed is printed on failure.
      #
      # -json is what the skip enumeration below reads: it emits a `skip` event
      # naming the test for every test that skipped, whatever the call that
      # skipped it looked like, where the plain form prints one `ok <pkg>` line
      # for a package whose tests all pass or skip and discards the rest. The
      # stream is teed to a file for that step and rendered back to text for the
      # log, since raw JSON is not something to read. -json runs the test
      # binaries verbosely, so what the log gets is the `go test -v` form: a RUN
      # and a result line per test rather than one line per package. That is a
      # deliberate trade for the discarded output this step exists to recover.
      # node does the rendering because this job already depends on it —
      # `task web:build` above is what installs and uses it.
      #
      # The renderer prints EVERY event carrying Output, not only the ones whose
      # Action is "output": a compile or vet failure in a _test.go arrives as
      # "build-output" and nowhere else — stderr stays empty — so filtering on
      # the action reduces a broken test file to `FAIL <pkg> [build failed]` with
      # the path, line and message gone. `go build ./...` above does not cover
      # that; it exits 0 with a _test.go that does not compile.
      - name: Go tests
        shell: bash
        run: |
          set -o pipefail
          go test -count=1 -shuffle=on -json ./... | tee "$GO_TEST_EVENTS" | node -e '
            const rl = require("readline").createInterface({ input: process.stdin });
            rl.on("line", (line) => {
              let event;
              try { event = JSON.parse(line); } catch { process.stdout.write(line + "\n"); return; }
              if (event.Output) process.stdout.write(event.Output);
            });
          '
      # ADVISORY, not a gate: this step prints the skip set and exits 0 whatever
      # it contains. The cross-leg comparison — "the windows leg skipped 15 tests
      # the linux leg ran" is a question about the runner, and neither leg's log
      # can raise it alone — is a human reading two job summaries.
      #
      # It is wider than the tally below, which counts only the skips
      # internal/testskip is told about, but it sees only skips that actually
      # FIRED. A symlink skip on a leg where symlinks work never runs, so it does
      # not appear here at all — which is why this does NOT replace the static
      # enrollment guard in internal/testskip, the one that fails the build when
      # such a skip is WRITTEN rather than when it runs.
      - name: List the tests that skipped
        if: always()
        shell: bash
        run: |
          [ -s "$GO_TEST_EVENTS" ] || exit 0
          node -e '
            const fs = require("fs");
            const skipped = new Set();
            for (const line of fs.readFileSync(process.env.GO_TEST_EVENTS, "utf8").split("\n")) {
              if (!line) continue;
              let event;
              try { event = JSON.parse(line); } catch { continue; }
              if (event.Action === "skip" && event.Test) skipped.add(event.Package + "." + event.Test);
            }
            const names = [...skipped].sort();
            console.log("## " + names.length + " test(s) skipped on ${{ matrix.os }}");
            for (const name of names) console.log("- `" + name + "`");
          ' | tee -a "$GITHUB_STEP_SUMMARY"
      # The counts the step above cannot print. `if: always()` because a failing
      # test run is exactly when knowing which guards never ran matters most, and
      # the job summary because a log line still has to be gone looking for.
      - name: Report the guards that did not run
        if: always()
        shell: bash
        run: |
          report="$NIBS_SKIP_REPORT"
          # Git Bash on the windows runner gets a backslash path from
          # github.workspace; cygpath is absent everywhere else.
          if command -v cygpath >/dev/null 2>&1; then
            report="$(cygpath -u "$report")"
          fi
          if [ -s "$report" ]; then
            cat "$report"
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Every environment-dependent guard ran; nothing was skipped."
          fi
      # Run the concurrency-critical packages under the race detector so a
      # reintroduced data race fails CI (nibs-7l3v). Linux-only: -race on
      # Windows needs a mingw toolchain and is materially slower, and the
      # invariants are OS-independent, so one detector lane suffices.
      - run: go test -race -count=1 ./internal/nibcore/... ./internal/graph/...
        if: matrix.os == 'ubuntu-latest'
      - run: cd web && npx vitest run --reporter=default

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # As in the test job: go, node, task and golangci-lint all come from
      # mise.toml. golangci-lint matters most here — its analyzers key off the
      # Go version they run under, so a floating toolchain can move the lint
      # baseline on untouched code.
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      # Through Task for the same reason as the test job (nibs-9146). web:build
      # is not only for coverage here: embed.go embeds web/dist, so the package
      # does not load for golangci-lint without it. web:install is a dep of
      # web:check too, but skips there — web:build's stamp is still fresh.
      - run: task web:build
      - run: task web:check
      # `task lint` rather than golangci-lint-action, which needed its own
      # `version:` input and was the last site restating a pinned version. The
      # task runs the linter through `mise exec`, so this job and a contributor
      # running `task lint` locally reach the same binary by the same path —
      # the agreement the pin exists to produce, rather than two mechanisms
      # that have to be kept saying the same thing.
      - run: task lint
      # Rides in the lint job rather than a job of its own: govulncheck needs the
      # module to load, so it needs web/dist (embed.go), which this job has
      # already built. A separate job would give a cleaner signal but would
      # duplicate the web build on every push to gain it.
      #
      # This covers changed code. Advisories are also published against code that
      # has not changed, which no push-triggered run can catch — vulncheck.yml
      # runs on a schedule for those.
      - run: task vulncheck
      # The npm half of the same gate (nibs-uilw). It rides in this job for a
      # different reason than the line above: npm audit resolves the tree from
      # package-lock.json and needs no node_modules and no web/dist, so nothing
      # is being shared with it — it is here because the job already has node,
      # and one more cheap step beats a second runner.
      #
      # It is not redundant with Dependabot alerts, for two reasons measured on
      # 2026-08-08. Those alerts are computed from the *default branch* only, so
      # they are blind to `develop`, where every change lands first: `main` had
      # 36 alerts that day while `develop`'s lockfile audited clean. And the two
      # sources disagree on content — npm audit reported a high-severity
      # brace-expansion advisory (GHSA-rgw5-rvv9-x895) that the alert list did
      # not carry at all. An alert is also a banner, not a build failure.
      - run: task web:vulncheck
