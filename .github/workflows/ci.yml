name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      # The web build runs through Task so the web:install gate executes on
      # every CI run instead of being bypassed by a hand-written `npm ci`
      # (nibs-9146). `task web:build` is web:install → go:codegen (which is
      # `go generate ./...`) → `npm run build`, so it replaces both steps.
      # A runner is always fresh, so this is the cold-install path only.
      #
      # Task comes from `go install` rather than a third-party action: setup-go
      # above already supplies the toolchain and puts $(go env GOPATH)/bin on
      # PATH on every runner OS (its addBinToPath, called unconditionally — if
      # a future setup-go drops that, `task` stops resolving and this needs a
      # $GITHUB_PATH step). `@latest` floats, matching mise.toml's
      # `task = "latest"`; the v3 import path bounds it to that major line.
      - run: go install github.com/go-task/task/v3/cmd/task@latest
      - run: task web:build
      # The Go steps stay direct instead of going through `task test`, which is
      # not equivalent to this job: it runs -race on every OS (see below), runs
      # web:check (the lint job owns that), and shells out to
      # scripts/go-test-capped.sh, which needs bash and degrades to an uncapped
      # run wherever there is no user systemd manager.
      - run: go build ./...
      - run: go test -count=1 ./...
      # Run the concurrency-critical packages under the race detector so a
      # reintroduced data race fails CI (nibs-7l3v). Linux-only: -race on
      # Windows needs a mingw toolchain and is materially slower, and the
      # invariants are OS-independent, so one detector lane suffices.
      - run: go test -race -count=1 ./internal/nibcore/... ./internal/graph/...
        if: matrix.os == 'ubuntu-latest'
      - run: cd web && npx vitest run --reporter=default

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      # Through Task for the same reason as the test job (nibs-9146). web:build
      # is not only for coverage here: embed.go embeds web/dist, so the package
      # does not load for golangci-lint without it. web:install is a dep of
      # web:check too, but skips there — web:build's stamp is still fresh.
      - run: go install github.com/go-task/task/v3/cmd/task@latest
      - run: task web:build
      - run: task web:check
      - uses: golangci/golangci-lint-action@v9
