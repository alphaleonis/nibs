name: Vulnerability scan

# CI runs `task vulncheck` on every push, which covers code as it changes. It
# cannot cover the other way a vulnerability arrives: an advisory published
# against a dependency nobody touched. Nothing in the repository changes, so no
# push-triggered run fires, and the finding waits for whenever someone next
# happens to push. This job is what closes that gap (nibs-9r1b).
#
# Weekly rather than daily: the gate is a build-failure control, not a pager, and
# a daily run mostly produces identical green results. workflow_dispatch is here
# so it can be run on demand after a dependency change.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC — off the hour, where scheduling is contended
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      # embed.go embeds web/dist, so the package does not load without it and
      # govulncheck would report a missing embed pattern rather than scanning
      # dependencies. Unlike the lint job there is nothing here to share it with,
      # so this job builds it itself.
      - run: task web:build
      - run: task vulncheck
      # The npm tree has the same problem this whole workflow exists for, and
      # more acutely: its advisory volume is dominated by transitive packages
      # nobody here ever edits, so "nothing changed" is the normal case rather
      # than the exception (nibs-uilw). Needs no web/dist of its own — npm audit
      # reads package-lock.json.
      - run: task web:vulncheck
