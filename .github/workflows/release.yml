name: Release
run-name: "Release ${{ inputs.version }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., v0.1.0 or v0.1.0-alpha.1)"
        required: true
        type: string

permissions:
  contents: write     # push tags and create the release
  actions: read       # read the CI run conclusion for the release commit
  # Both are for actions/attest-build-provenance below. id-token mints the
  # short-lived OIDC token that identifies this workflow to Sigstore; the
  # attestation is signed against that identity, so there is no key to store or
  # rotate. Neither grants anything to the rest of the job that it did not
  # already have — attestations: write only writes to the attestations API.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version format
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-.+)?$ ]]; then
            echo "::error::Version must match vX.Y.Z or vX.Y.Z-suffix format (got: $VERSION)"
            exit 1
          fi
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require release from main
        run: |
          if [[ "${{ github.ref }}" != "refs/heads/main" ]]; then
            echo "::error::Release must be dispatched from main (got: ${{ github.ref }}). CI only runs on main, so other refs have no signal to gate on."
            exit 1
          fi

      - name: Require passing CI on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${{ github.sha }}"
          echo "Checking CI (ci.yml) status for commit $SHA"
          RUN=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$SHA" \
            --jq '.workflow_runs | sort_by(.created_at) | last')
          if [[ -z "$RUN" || "$RUN" == "null" ]]; then
            echo "::error::No CI run found for $SHA. CI must run and pass on main before releasing — push to main and wait for CI to finish."
            exit 1
          fi
          STATUS=$(jq -r '.status' <<<"$RUN")
          CONCLUSION=$(jq -r '.conclusion' <<<"$RUN")
          echo "Latest CI run for $SHA: status='$STATUS' conclusion='$CONCLUSION'"
          if [[ "$STATUS" != "completed" ]]; then
            echo "::error::CI for $SHA is '$STATUS' (not yet completed). Wait for CI to finish before releasing."
            exit 1
          fi
          if [[ "$CONCLUSION" != "success" ]]; then
            echo "::error::CI for $SHA concluded '$CONCLUSION' (need: success). Refusing to release from a red commit."
            exit 1
          fi
          echo "CI passed for $SHA — proceeding to tag and release."

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Check tag does not exist
        run: |
          if git rev-parse "${{ inputs.version }}" >/dev/null 2>&1; then
            echo "::error::Tag ${{ inputs.version }} already exists"
            exit 1
          fi

      - name: Verify changelog entry
        if: steps.version.outputs.prerelease == 'false'
        run: |
          if ! grep -q "^## ${{ inputs.version }}" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no entry for ${{ inputs.version }}"
            exit 1
          fi

      - name: Extract release notes
        run: |
          if [[ "${{ steps.version.outputs.prerelease }}" == "true" ]]; then
            echo "Pre-release build from $(git rev-parse --short HEAD)." > ${{ runner.temp }}/release-notes.md
          else
            awk '/^## ${{ inputs.version }}/{found=1; next} /^## /{if(found) exit} found' CHANGELOG.md > ${{ runner.temp }}/release-notes.md
            if [[ ! -s ${{ runner.temp }}/release-notes.md ]]; then
              echo "::error::Release notes for ${{ inputs.version }} are empty"
              exit 1
            fi
          fi

      - name: Create and push tag
        run: |
          git tag "${{ inputs.version }}"
          git push origin "${{ inputs.version }}"

      # Every tool this job runs — go, node, goreleaser, go-licenses — comes
      # from mise.toml, the same file ci.yml reads. That makes the published
      # binaries the work of the toolchain CI built and tested this commit
      # with (nibs-23f0), and it puts the two release-path tools under an exact
      # pin instead of `~> v2` and `@latest` (nibs-ag7i).
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # GoReleaser runs as the pinned binary mise installed rather than through
      # goreleaser-action, so the version that assembles the archives and
      # generates checksums.txt is the one mise.toml names — the action's
      # `version:` input was a second, separately-floating copy that Renovate's
      # github-actions manager does not read. It also removes a third-party
      # action from a job holding `contents: write`.
      - name: Release
        run: goreleaser release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Provenance for what was just published: a signed statement that these
      # exact bytes were built by this workflow, from this repository, at this
      # commit. checksums.txt alone cannot say that — it lives in the same
      # release as the archives it vouches for, so it catches corruption in
      # transit but not anyone able to write that release (nibs-bw1u).
      #
      # Anchored in Sigstore and GitHub's OIDC identity rather than a key we
      # hold, so there is nothing to store, protect or rotate. `nibs upgrade`
      # does not consume this — go-selfupdate verifies a checksum file, not an
      # attestation — so this covers humans and install.sh; the self-update
      # path is the other half of nibs-bw1u.
      #
      # Verify a downloaded asset with:
      #   gh attestation verify nibs_linux_amd64.tar.gz --repo alphaleonis/nibs
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

      - name: Delete tag on failure
        if: failure()
        run: git push origin --delete "${{ inputs.version }}" || true
