name: Release
run-name: "Release ${{ inputs.version }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., v0.1.0 or v0.1.0-alpha.1)"
        required: true
        type: string

# Each job grants itself what it needs. Only `publish` can write to the
# repository, and it runs no build code. `build` runs the install scripts of
# every package in web/package-lock.json, so it holds only a read token.
permissions: {}

# One release run at a time: the existing-release check runs before the draft
# exists, so two concurrent runs for one version could both pass it.
concurrency:
  group: release
  cancel-in-progress: false

# A `${{ }}` expression is substituted into the script text before any shell
# reads it, so a value the dispatcher chooses — the input, and the ref the run
# was dispatched from — is program source rather than data, and no amount of
# quoting at the call site changes that: a value carrying a quote closes the
# string and the rest parses as code. The steps below therefore take such values
# through `env:` and read them as shell variables. internal/ciguard enforces
# that as an ALLOWLIST: a `run:` body may interpolate the paths listed in its
# `allowedPaths`, and naming anything else fails `task test`.
#
# One gap survives the allowlist: a value written to `$GITHUB_OUTPUT` and read
# back as `steps.*.outputs.*` is laundered past the check. The only such output
# read inside a `run:` body is `version.prerelease`, which the check job writes
# as one of the two literals `true` and `false`.
env:
  VERSION: ${{ inputs.version }}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read     # read the CI run conclusion for the release commit
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Validate version format
        id: version
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-.+)?$ ]]; then
            echo "::error::Version must match vX.Y.Z or vX.Y.Z-suffix format (got: $VERSION)"
            exit 1
          fi
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require release from main
        env:
          REF: ${{ github.ref }}
        run: |
          if [[ "$REF" != "refs/heads/main" ]]; then
            echo "::error::Release must be dispatched from main (got: $REF). CI only runs on main, so other refs have no signal to gate on."
            exit 1
          fi

      - name: Require passing CI on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${{ github.sha }}"
          echo "Checking CI (ci.yml) status for commit $SHA"
          RUN=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$SHA" \
            --jq '.workflow_runs | sort_by(.created_at) | last')
          if [[ -z "$RUN" || "$RUN" == "null" ]]; then
            echo "::error::No CI run found for $SHA. CI must run and pass on main before releasing — push to main and wait for CI to finish."
            exit 1
          fi
          STATUS=$(jq -r '.status' <<<"$RUN")
          CONCLUSION=$(jq -r '.conclusion' <<<"$RUN")
          echo "Latest CI run for $SHA: status='$STATUS' conclusion='$CONCLUSION'"
          if [[ "$STATUS" != "completed" ]]; then
            echo "::error::CI for $SHA is '$STATUS' (not yet completed). Wait for CI to finish before releasing."
            exit 1
          fi
          if [[ "$CONCLUSION" != "success" ]]; then
            echo "::error::CI for $SHA concluded '$CONCLUSION' (need: success). Refusing to release from a red commit."
            exit 1
          fi
          echo "CI passed for $SHA — proceeding to tag and release."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check tag does not exist
        run: |
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag $VERSION already exists"
            exit 1
          fi

      - name: Verify changelog entry
        if: steps.version.outputs.prerelease == 'false'
        run: |
          if ! grep -q "^## $VERSION" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no entry for $VERSION"
            exit 1
          fi

      - name: Extract release notes
        run: |
          if [[ "${{ steps.version.outputs.prerelease }}" == "true" ]]; then
            echo "Pre-release build from $(git rev-parse --short HEAD)." > ${{ runner.temp }}/release-notes.md
          else
            # ENVIRON rather than -v: awk processes escape sequences in a -v
            # assignment, so `\n` in the value would reach the program as a
            # newline (measured: length 3 via -v, 4 via ENVIRON). index()==1 is
            # the anchored literal prefix the heading is meant to be matched by.
            awk 'BEGIN { heading = "## " ENVIRON["VERSION"] }
                 index($0, heading) == 1 { found = 1; next }
                 /^## / { if (found) exit }
                 found' CHANGELOG.md > ${{ runner.temp }}/release-notes.md
            if [[ ! -s ${{ runner.temp }}/release-notes.md ]]; then
              echo "::error::Release notes for $VERSION are empty"
              exit 1
            fi
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error

  # Runs every third-party build dependency, so it holds no secret and only a
  # read token. Its one output is the `dist` artifact.
  build:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # GoReleaser reads the version from this tag, which stays local. GitHub
      # creates the tag at the draft's target commit when it is published.
      - name: Create local tag
        run: git tag "$VERSION"

      # Every tool this job runs — go, node, goreleaser, go-licenses — comes
      # from mise.toml, the same file ci.yml reads, so the published binaries
      # are built by the toolchain CI tested this commit with.
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # Generated code, web assets and license notices; runs `npm ci`.
      - name: Build release inputs
        run: task release:prep

      # .goreleaser.yaml disables its release stage, and --skip=publish keeps
      # that true if the config ever enables one.
      - name: Build archives
        run: goreleaser release --clean --skip=publish

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          if-no-files-found: error

  # Signs on a fresh runner, from a fresh checkout. In the build job, npm
  # install scripts can rewrite files a later step runs, such as the signer, so
  # the key never enters that job.
  sign:
    needs: build
    runs-on: ubuntu-latest
    # The `release` environment holds NIBS_SIGNING_KEY and requires a reviewer,
    # so this job waits for approval. Every later job needs this one, so nothing
    # is attested or published without that approval.
    environment: release
    permissions:
      contents: read
    outputs:
      checksums-sha256: ${{ steps.digests.outputs.checksums }}
      signature-sha256: ${{ steps.digests.outputs.signature }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Go alone, and no cache: a cache another job saved could hold a
      # toolchain that job's build dependencies replaced.
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          install_args: go
          cache: false

      # Outside the checkout, so nothing the build job produced sits where
      # `go run` reads its module and workspace files.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: ${{ runner.temp }}/dist

      # The signature covers checksums.txt alone, so it vouches for the
      # archives only if checksums.txt matches them.
      - name: Check the archives against checksums.txt
        working-directory: ${{ runner.temp }}/dist
        run: sha256sum --check --strict checksums.txt

      # Signing with a key no binary carries produces a valid-looking signature
      # that every `nibs upgrade` then rejects, so check the key first.
      - name: Verify the signing key is one binaries trust
        run: go run ./internal/signing/cmd/verify -check-key
        env:
          NIBS_SIGNING_KEY: ${{ secrets.NIBS_SIGNING_KEY }}

      # Empty or absent fails here rather than publishing unsigned — see
      # internal/signing/cmd/sign.
      - name: Sign checksums.txt
        run: go run ./internal/signing/cmd/sign -in "$RUNNER_TEMP/dist/checksums.txt" -out "$RUNNER_TEMP/dist/checksums.txt.sig"
        env:
          NIBS_SIGNING_KEY: ${{ secrets.NIBS_SIGNING_KEY }}

      # The key check proves the key is trusted; this proves the signature is
      # over these bytes. A failure here stops the run before any draft exists.
      - name: Verify the signature
        run: go run ./internal/signing/cmd/verify -in "$RUNNER_TEMP/dist/checksums.txt" -sig "$RUNNER_TEMP/dist/checksums.txt.sig"

      # The publish job compares its downloads against these digests.
      - name: Record digests
        id: digests
        working-directory: ${{ runner.temp }}/dist
        run: |
          echo "checksums=$(sha256sum checksums.txt | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "signature=$(sha256sum checksums.txt.sig | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signature
          path: ${{ runner.temp }}/dist/checksums.txt.sig
          if-no-files-found: error

  # Provenance: a signed statement that these exact bytes were built by this
  # workflow, from this repository, at this commit. checksums.txt alone cannot
  # say that, because anyone able to write the release can replace both.
  #
  # Anchored in Sigstore and GitHub's OIDC identity, so there is no key to
  # store or rotate. `nibs upgrade` and the install scripts do not check it.
  # Verify a downloaded asset with:
  #   gh attestation verify nibs_linux_amd64.tar.gz --repo alphaleonis/nibs
  attest:
    needs: [build, sign]
    runs-on: ubuntu-latest
    permissions:
      id-token: write       # mint the OIDC token that Sigstore signs against
      attestations: write   # store the attestation
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: release

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signature
          path: release

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*.tar.gz
            release/*.zip
            release/checksums.txt
            release/checksums.txt.sig

  # The only job that can write to the repository. It checks out no code and
  # runs no build tools: it downloads the artifacts, checks them, and creates
  # the draft.
  publish:
    needs: [check, sign, attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the draft release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: release

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signature
          path: release

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes

      # Pins every uploaded byte to what the sign job verified: checksums.txt
      # and its signature by digest, and each archive through checksums.txt.
      - name: Check the files against what the sign job verified
        working-directory: release
        env:
          CHECKSUMS_SHA256: ${{ needs.sign.outputs.checksums-sha256 }}
          SIGNATURE_SHA256: ${{ needs.sign.outputs.signature-sha256 }}
        run: |
          echo "$CHECKSUMS_SHA256  checksums.txt" | sha256sum --check --strict
          echo "$SIGNATURE_SHA256  checksums.txt.sig" | sha256sum --check --strict
          sha256sum --check --strict checksums.txt

      # A draft has no tag until it is published, so the check job's tag check
      # cannot see a leftover draft. The list endpoint returns drafts only to a
      # token with write access, which is why this runs here.
      - name: Check no release or draft carries this version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAGS=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[].tag_name')
          if grep -Fxq -- "$VERSION" <<<"$TAGS"; then
            echo "::error::A release or draft for $VERSION already exists. Delete the draft, or release another version."
            exit 1
          fi

      # --draft with --target creates no tag: GitHub creates it at the target
      # commit when the draft is published, and the default branch can move
      # before then.
      #
      # --prerelease is not cosmetic: `nibs upgrade` filters on GitHub's
      # prerelease flag, not on the tag's semver suffix, so an unmarked
      # pre-release is offered to every user as a stable upgrade.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          # Only a line whose name sha256sum reads as one word passes, and the
          # name comes from that match, so the uploaded set is the checked set.
          archives=()
          while IFS= read -r line || [[ -n "$line" ]]; do
            if [[ ! "$line" =~ ^[0-9a-f]{64}\ \ ([A-Za-z0-9._-]+)$ ]]; then
              echo "::error::checksums.txt has an unexpected line: $line"
              exit 1
            fi
            archives+=("${BASH_REMATCH[1]}")
          done < release/checksums.txt
          flags=(--repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" --title "$VERSION" --notes-file notes/release-notes.md)
          if [[ "$PRERELEASE" == "true" ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$VERSION" "${flags[@]}" \
            "${archives[@]/#/release/}" release/checksums.txt release/checksums.txt.sig
