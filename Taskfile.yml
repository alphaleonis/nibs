version: '3'

# Task (https://taskfile.dev) replaces mise's task runner for this project.
# mise is still used for tool version management via mise.toml ([tools]).
#
# Task uses an embedded POSIX shell (mvdan/sh) that runs identically on
# Windows, macOS, and Linux — no Git Bash / cmd.exe divergence.
#
# Common usage:
#   task           → list tasks (same as task --list)
#   task build     → build ./nibs (or ./nibs.exe on Windows)
#   task test      → run all tests (Go + web)
#   task demo      → serve the web UI against the sample fixture
#   task --list    → show all tasks with descriptions

tasks:
  default:
    desc: List all tasks
    cmds:
      - task --list
    silent: true

  codegen:
    desc: Regenerate GraphQL code
    cmds:
      - go generate ./...

  web:build:
    desc: Build the web UI (Svelte + Vite)
    deps: [codegen]
    dir: web
    cmds:
      - npm ci
      - npm run build

  web:check:
    desc: Type-check the web UI (svelte-check)
    # No codegen dep: svelte-check only reads web/ TS+Svelte sources and
    # node_modules — nothing under web/src imports Go-generated GraphQL code.
    # Wired into the `test` gate (svelte-check is clean; see nibs-pg6i).
    dir: web
    cmds:
      - npm run check

  build:
    desc: Build the nibs CLI executable
    deps: [web:build]
    vars:
      VERSION:
        sh: git describe --tags --always --dirty 2>/dev/null || echo dev
      COMMIT:
        sh: git rev-parse --short HEAD 2>/dev/null || echo unknown
      # DATE is computed via Task's template engine (sprig) instead of
      # shelling out to `date`, which isn't on PATH on Windows without
      # Git Bash. RFC3339 in UTC, matching the previous bash output.
      DATE: '{{now | date "2006-01-02T15:04:05Z"}}'
    cmds:
      - >-
        go build
        -ldflags "-X github.com/alphaleonis/nibs/cmd.version={{.VERSION}}
        -X github.com/alphaleonis/nibs/cmd.commit={{.COMMIT}}
        -X github.com/alphaleonis/nibs/cmd.date={{.DATE}}"
        .

  test:
    desc: Run all tests (Go + web, incl. the -race gate on nibcore + graph)
    deps: [web:build]
    cmds:
      # Go tests run memory-capped so a runaway test is OOM-killed inside its own
      # cgroup instead of triggering a global OOM that takes down the WSL VM
      # (nibs-mv0i). Falls back to plain `go test` where systemd --user scopes
      # aren't available. Override the cap with GO_TEST_MEM_MAX (default 4G).
      - bash scripts/go-test-capped.sh ./...
      # Run the concurrency-critical packages a second time under -race, so a
      # reintroduced data race fails the default gate rather than only when
      # someone remembers to pass -race by hand (nibs-7l3v). Many guards in these
      # packages (payload-snapshot / live-pointer detachment, the GetForUpdate
      # clone-under-lock guard, the store-level freeze guard) are only meaningful
      # under the detector; a plain `go test` degrades them to trivial checks.
      - task: test:race
      - cd web && npm run check
      - cd web && npx vitest run --reporter=agent

  test:race:
    desc: Run the -race detector on the concurrency-critical packages (nibcore + graph)
    cmds:
      # Scoped to the two packages that carry the concurrency invariants — a full
      # `-race ./...` is slow (the watcher tests use real debounce timing).
      # -count=1 defeats the test cache so the detector always actually runs.
      - bash scripts/go-test-capped.sh -race -count=1 ./internal/nibcore/... ./internal/graph/...

  nibs:
    desc: Build and run the nibs CLI (pass args after `--`, e.g. `task nibs -- list --json`)
    deps: [web:build]
    cmds:
      - go run . {{.CLI_ARGS}}

  install:
    desc: Install nibs to ~/.local/bin
    deps: [build]
    cmds:
      - cp nibs ~/.local/bin/nibs

  playwright:
    desc: Run Playwright e2e tests (requires built binary)
    deps: [build]
    dir: web
    cmds:
      - npx playwright test

  screenshots:
    desc: Capture web UI screenshots for visual verification (web/screenshots/output)
    deps: [web:build]
    dir: web
    cmds:
      - npx playwright test --config=playwright.screenshots.config.ts

  demo:
    desc: Serve the web UI with the sample project fixture (temporary copy)
    # Task's built-in u-root mktemp defaults to /tmp (which doesn't exist on
    # Windows), so we pass -p with the platform temp dir explicitly. The
    # TMP var is captured once and cleaned up via Task's defer, which is
    # cross-platform by design (no bash trap / SIGINT handling needed).
    vars:
      TMP:
        sh: mktemp -d -p "{{env "TEMP" | default "/tmp"}}"
    cmds:
      - defer: rm -rf "{{.TMP}}"
      - cp -r testdata/fixtures/sample-project/.nibs testdata/fixtures/sample-project/.nibs.yml "{{.TMP}}/"
      - echo "Using temporary copy at {{.TMP}}"
      # --config, not --nibs-path: this runs from the repo root, and --nibs-path
      # moves only the data directory — config discovery would still walk up from
      # the cwd and apply THIS project's prefix to fixture data. Naming the
      # fixture's config resolves its data directory alongside it.
      - go run . serve --config "{{.TMP}}/.nibs.yml" {{.CLI_ARGS}}

  demo:tui:
    desc: Run the TUI with the sample project fixture (temporary copy)
    vars:
      TMP:
        sh: mktemp -d -p "{{env "TEMP" | default "/tmp"}}"
    cmds:
      - defer: rm -rf "{{.TMP}}"
      - cp -r testdata/fixtures/sample-project/.nibs testdata/fixtures/sample-project/.nibs.yml "{{.TMP}}/"
      - echo "Using temporary copy at {{.TMP}}"
      # --config, not --nibs-path — see the demo task above.
      - go run . tui --config "{{.TMP}}/.nibs.yml"

  check:
    desc: Type-check the web UI (svelte-check)
    deps: [web:check]

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  licenses:
    desc: Collect third-party dependency licenses
    cmds:
      - go-licenses save ./... --save_path=./third_party_licenses --force --ignore github.com/alphaleonis/nibs
      - go-licenses report ./... --ignore github.com/alphaleonis/nibs > ./third_party_licenses/NOTICES.csv 2>/dev/null
