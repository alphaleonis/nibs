version: '3'

# Task (https://taskfile.dev) replaces mise's task runner for this project.
# mise is still used for tool version management via mise.toml ([tools]).
#
# Task uses an embedded POSIX shell (mvdan/sh) that runs identically on
# Windows, macOS, and Linux — no Git Bash / cmd.exe divergence.
#
# Common usage:
#   task           → list tasks (same as task --list)
#   task build     → build ./nibs (or ./nibs.exe on Windows)
#   task test      → run all tests (Go + web)
#   task demo      → serve the web UI against the sample fixture
#   task --list    → show all tasks with descriptions

tasks:
  default:
    desc: List all tasks
    cmds:
      - task --list
    silent: true

  codegen:
    desc: Regenerate GraphQL code (Go gqlgen + web graphql-codegen client preset) and the web's generated vocabulary
    cmds:
      - task: go:codegen
      - task: web:codegen

  go:codegen:
    desc: Regenerate the Go GraphQL server code (gqlgen) and the web vocabulary module (internal/webvocab)
    cmds:
      - go generate ./...

  web:codegen:
    desc: Regenerate the web GraphQL types (graphql-codegen client preset)
    deps: [web:install]
    dir: web
    cmds:
      - npm run codegen

  web:install:
    desc: Install the web dependencies, but only when they are missing, stale, or broken
    dir: web
    # status: entries are ANDed — the install is skipped only when the tree was
    # built from the lockfile we have now AND both health probes pass.
    #
    # node_modules/.installed-lock.json is a byte copy of the package-lock.json a
    # completed, verified-healthy install was made from. Comparing against it
    # answers "is this tree built from THIS lockfile?" rather than merely "is it
    # intact?", and it answers it from evidence the install itself left behind.
    # The stamp deliberately lives *inside* node_modules so it dies with the tree;
    # a checksum cached outside it (Task's own sources: bookkeeping) survives
    # `rm -rf node_modules` and can assert freshness about a tree that no longer
    # exists. It also subsumes npm's own .package-lock.json marker, since it is
    # written only after that install passed the health checks below.
    #
    # The health probes catch a tree npm left broken (nibs-wcx3): `npm ci` has
    # been observed reporting success while leaving node_modules/.bin empty,
    # which surfaces much later as `sh: 1: vite: not found` (exit 127).
    #
    # `cmp` has no Go-native fallback in Task's embedded shell, so on a machine
    # without it (notably Windows without Git Bash) this probe fails rather than
    # compares. That direction is the safe one: a failed probe means "not up to
    # date", so the install runs. The cost is a redundant reinstall every build,
    # never a stale tree.
    status:
      - cmp -s package-lock.json node_modules/.installed-lock.json
      - test -f node_modules/.bin/vite
      - test -f node_modules/.bin/graphql-codegen
    # DO NOT run two `task` invocations that both install at the same time.
    #
    # There is deliberately no lock here. An earlier revision serialized installs
    # with a `mkdir` lock directory, on the usual assumption that `mkdir` fails
    # atomically when the directory exists. That assumption does not hold on the
    # toolchains this project runs on:
    #
    #   * `/usr/bin/mkdir` on this machine is uutils coreutils 0.8.0 (the Ubuntu
    #     26.04 default). Measured on ext4: 49 of 300 concurrent pairs had BOTH
    #     processes exit 0, against 0 of 300 for the raw mkdir(2) syscall in the
    #     same directory. The kernel is fine; the binary is not.
    #   * [Unverified] On Windows, Task's Go-native `mkdir` reportedly prints
    #     "file exists" and still exits 0, so the wait loop never engages at all.
    #
    # A lock that silently fails to exclude is worse than none: it invites exactly
    # the false confidence that let a concurrent install corrupt a verification run
    # while this fix was being developed. What actually keeps the gate reliable is
    # the staleness stamp and the health probes above — they make installs rare
    # (only when package-lock.json changes) and self-healing when npm leaves a
    # broken tree. Concurrency is handled by not doing it. See nibs-wcx3.
    #
    # "Not doing it" includes not retrying a canceled run too soon. Signaling
    # Task's PID alone does not stop it: the current command finishes, every
    # remaining command still runs, and Task exits 0; signaling the process
    # group does abort it (Task v3.50.0 on Linux/WSL; [Unverified] on Windows).
    # A run canceled by subprocess.terminate() or child_process.kill(), which
    # signal the PID by definition, can therefore still be inside `npm ci` here,
    # and an immediate retry becomes the second concurrent install. [Unverified]
    # Whether a CI step timeout or an agent harness signals the PID or the group
    # is untested either way. Confirm the orphan has exited first — CLAUDE.md's
    # Testing section carries the per-platform check. See nibs-uur9.
    cmds:
      - cmd: |
          # Snapshot the lockfile BEFORE installing, and stamp from the snapshot
          # afterwards. `npm ci` reads package-lock.json at its start, so stamping
          # from the file as it stands at the *end* would certify this tree as
          # matching whatever the lockfile happens to say by then. A change landing
          # mid-install (a branch switch, a rebase, a hand-run `npm install`) would
          # be recorded as installed when it was not, and every later run would
          # report "up to date" against dependencies it never installed. Stamping
          # from the snapshot fails the other way: the stamp mismatches, and the
          # next run reinstalls.
          cp package-lock.json .installed-lock.tmp
          # Delete node_modules ourselves before installing. `npm ci` discards it
          # wholesale anyway, so nothing is lost. The failure being mitigated is
          # `ENOTEMPTY: directory not empty, rmdir .../node_modules/...` raised from
          # inside npm's own delete; nibs-wcx3 records that it occurs with no
          # concurrency at all, just less often. [Unverified] The mechanism — npm's
          # parallel delete racing itself, which one sequential pass cannot do — is
          # conjecture rather than an established root cause; a third party creating
          # entries during the walk (file watcher, editor, indexer) would raise the
          # same error against a sequential delete too. Scope item 3 of nibs-wcx3 is
          # closed as "trigger removed", not "cause identified".
          rm -rf node_modules
          # --loglevel=error silences npm's warn-level transitive-dep deprecation
          # chatter (e.g. node-domexception, pulled 6 levels deep under
          # @graphql-codegen/cli) so `task build`/`task test` output stays warning-free.
          npm ci --no-audit --no-fund --loglevel=error
          # Probe the same set status: declares healthy. Checking vite alone lets a
          # tree missing graphql-codegen exit this task clean and die later in
          # `npm run build`'s prebuild hook with `graphql-codegen: not found`
          # (exit 127) — the exact confusing failure this task exists to prevent.
          if [ ! -f node_modules/.bin/vite ] || [ ! -f node_modules/.bin/graphql-codegen ]; then
            echo "task: npm ci left node_modules/.bin unpopulated; repairing with npm rebuild" >&2
            npm rebuild --loglevel=error
          fi
          if [ ! -f node_modules/.bin/vite ] || [ ! -f node_modules/.bin/graphql-codegen ]; then
            rm -f .installed-lock.tmp
            echo "task: node_modules/.bin is still unpopulated after npm rebuild — the web toolchain is unusable" >&2
            echo "task: retry from a clean tree with: rm -rf web/node_modules && task web:install" >&2
            echo "task: if that fails too, investigate by hand with no other 'task' run active" >&2
            exit 1
          fi
          # Stamp last, and only here. Every earlier exit leaves the tree unstamped,
          # so a failed or still-broken install can never be mistaken for one built
          # from this lockfile.
          cp .installed-lock.tmp node_modules/.installed-lock.json
          rm -f .installed-lock.tmp

  web:build:
    desc: Build the web UI (Svelte + Vite)
    # web:install guarantees a complete node_modules before anything is run out
    # of it. go:codegen threads `go generate` into `task build`, but it is a
    # command rather than a second dep because Task runs deps concurrently, and
    # `go generate ./...` walks the whole repo — web/node_modules included — and
    # was observed failing with
    # `pattern ./...: open web/node_modules/@graphql-tools/wrap: no such file or directory`
    # when run as a parallel dep alongside web:install's delete (nibs-wcx3).
    # Sequencing it after the install removes the overlap.
    #
    # The web GraphQL types are regenerated by `npm run build` itself via the
    # `prebuild` npm hook (→ `npm run codegen`), which finds the codegen
    # toolchain already installed by web:install — so no web:codegen dep either.
    deps: [web:install]
    dir: web
    cmds:
      - task: go:codegen
      - npm run build

  web:check:
    desc: Type-check the web UI (svelte-check for src/, tsc for everything else)
    # No Task-level codegen dep needed: `npm run check` regenerates the web
    # GraphQL types itself via the `precheck` npm hook (→ `npm run codegen`)
    # before svelte-check runs, so the generated src/lib/gql/ types are always
    # fresh. Wired into the `test` gate (svelte-check is clean; see nibs-pg6i).
    #
    # web:check-tooling rides here rather than in `test` because this task is the
    # one thing both gates already call: `task test` runs it, and CI's lint job
    # runs `task web:check` directly (the test job deliberately does not go
    # through `task test`). Adding it to `test` alone would leave CI unguarded,
    # and adding it to CI as well would mean editing the workflow to say what
    # this task already says.
    deps: [web:install]
    dir: web
    cmds:
      # Capped for the same reason as the vitest lane in `test`: svelte-check
      # holds the whole project graph in one node process, and it should pay for
      # that out of its own cgroup rather than the caller's (nibs-0kip).
      - bash ../scripts/run-capped.sh --host-os {{OS}} npm run check
      - task: web:check-tooling

  web:check-tooling:
    desc: Type-check the web TypeScript outside src/ (Playwright suites, tool configs)
    # tsc rather than svelte-check: nothing outside src/ is a .svelte file, and
    # svelte-check takes a single --tsconfig, which is already spent on the app.
    # web/tsconfig.tooling.json records why the two configs stay separate rather
    # than one widened include.
    #
    # Ordering, not a dep, supplies the generated types: the Playwright specs
    # import src/lib types that src/lib/gql/ feeds, and every caller arrives
    # through web:check, whose `npm run check` runs the precheck codegen hook
    # first. Invoked standalone on a checkout that has never generated, this can
    # fail on a missing src/lib/gql/ — `task web:codegen` is the fix. Declaring
    # the dep instead would regenerate on the common path to serve the rare one.
    deps: [web:install]
    dir: web
    cmds:
      - bash ../scripts/run-capped.sh --host-os {{OS}} npx tsc --noEmit -p tsconfig.tooling.json

  build:
    desc: Build the nibs CLI executable
    deps: [web:build]
    vars:
      VERSION:
        sh: git describe --tags --always --dirty 2>/dev/null || echo dev
      COMMIT:
        sh: git rev-parse --short HEAD 2>/dev/null || echo unknown
      # DATE is computed via Task's template engine (sprig) instead of
      # shelling out to `date`, which isn't on PATH on Windows without
      # Git Bash. RFC3339 in UTC, matching the previous bash output.
      DATE: '{{now | date "2006-01-02T15:04:05Z"}}'
    cmds:
      - >-
        go build
        -ldflags "-X github.com/alphaleonis/nibs/cmd.version={{.VERSION}}
        -X github.com/alphaleonis/nibs/cmd.commit={{.COMMIT}}
        -X github.com/alphaleonis/nibs/cmd.date={{.DATE}}"
        .

  test:
    desc: Run all tests (Go + web, incl. the -race gate on nibcore + graph)
    deps: [web:build]
    env:
      # Where internal/testskip appends its tally of guards that did not run
      # because this machine could not build their fixture. Absolute, because
      # `go test ./...` runs each package's binary with that package's source
      # directory as its cwd — a relative path would scatter one file per
      # package. `go test` also DISCARDS a passing package's stdout in
      # package-list mode, so this file is the only channel a green run has.
      NIBS_SKIP_REPORT: '{{.ROOT_DIR}}/.skipped-guards.txt'
    cmds:
      # Stale counts from a previous run would read as this run's.
      - rm -f "$NIBS_SKIP_REPORT"
      # Go tests run memory-capped so a runaway test is OOM-killed inside its own
      # cgroup instead of triggering a global OOM that takes down the WSL VM
      # (nibs-mv0i). Falls back to plain `go test` where systemd --user scopes
      # aren't available. Override the cap with NIBS_CAP_MEM_MAX (default 4G).
      - bash scripts/go-test-capped.sh --host-os {{OS}} ./...
      # Silent when nothing was skipped, which is the normal case here.
      - cmd: 'if [ -s "$NIBS_SKIP_REPORT" ]; then cat "$NIBS_SKIP_REPORT"; fi'
        silent: true
      # Run the concurrency-critical packages a second time under -race, so a
      # reintroduced data race fails the default gate rather than only when
      # someone remembers to pass -race by hand (nibs-7l3v). Many guards in these
      # packages (payload-snapshot / live-pointer detachment, the GetForUpdate
      # clone-under-lock guard, the store-level freeze guard) are only meaningful
      # under the detector; a plain `go test` degrades them to trivial checks.
      - task: test:race
      - task: web:check
      # Capped for a different reason than the go lane above: vitest has never
      # run away, but it fans out across cores, and an uncapped fleet is charged
      # to whatever cgroup launched `task test`. When that is a long-lived agent
      # session, the kernel's memcg OOM killer picks the session over any single
      # worker and the supervisor dies instead of the tests (nibs-0kip). The
      # scope makes the lane pay for its own memory.
      - cd web && bash ../scripts/run-capped.sh --host-os {{OS}} npx vitest run --reporter=agent

  test:race:
    desc: Run the -race detector on the concurrency-critical packages (nibcore + graph)
    cmds:
      # Scoped to the two packages that carry the concurrency invariants — a full
      # `-race ./...` is slow (the watcher tests use real debounce timing).
      # -count=1 defeats the test cache so the detector always actually runs.
      - bash scripts/go-test-capped.sh --host-os {{OS}} -race -count=1 ./internal/nibcore/... ./internal/graph/...

  nibs:
    desc: Build and run the nibs CLI (pass args after `--`, e.g. `task nibs -- list --json`)
    deps: [web:build]
    cmds:
      - go run . {{.CLI_ARGS}}

  install:
    desc: Install nibs to ~/.local/bin
    deps: [build]
    cmds:
      - cp nibs ~/.local/bin/nibs

  playwright:
    desc: Run Playwright e2e tests (requires built binary)
    deps: [build]
    dir: web
    cmds:
      - npx playwright test

  screenshots:
    desc: Capture web UI screenshots for visual verification (web/screenshots/output)
    deps: [web:build]
    dir: web
    cmds:
      - npx playwright test --config=playwright.screenshots.config.ts

  favicon:
    desc: Regenerate web/public/favicon.ico from favicon.svg (run after editing the SVG)
    # Deliberately not wired into `build`: rasterizing needs a browser, and the
    # normal build must not depend on one. The .ico is committed instead.
    deps: [web:install]
    dir: web
    cmds:
      - node scripts/gen-favicon.ts

  demo:
    desc: Serve the web UI with the sample project fixture (temporary copy)
    # Task's built-in u-root mktemp defaults to /tmp (which doesn't exist on
    # Windows), so we pass -p with the platform temp dir explicitly. The
    # TMP var is captured once and cleaned up via Task's defer, which is
    # cross-platform by design (no bash trap / SIGINT handling needed).
    vars:
      TMP:
        sh: mktemp -d -p "{{env "TEMP" | default "/tmp"}}"
    cmds:
      - defer: rm -rf "{{.TMP}}"
      - cp -r testdata/fixtures/sample-project/.nibs "{{.TMP}}/"
      - echo "Using temporary copy at {{.TMP}}"
      # --nibs-path names the store, and the store carries its own config, so
      # the fixture is read under its own prefix even though this runs from the
      # repo root.
      - go run . serve --nibs-path "{{.TMP}}/.nibs" {{.CLI_ARGS}}

  demo:tui:
    desc: Run the TUI with the sample project fixture (temporary copy)
    vars:
      TMP:
        sh: mktemp -d -p "{{env "TEMP" | default "/tmp"}}"
    cmds:
      - defer: rm -rf "{{.TMP}}"
      - cp -r testdata/fixtures/sample-project/.nibs "{{.TMP}}/"
      - echo "Using temporary copy at {{.TMP}}"
      # --nibs-path names the store — see the demo task above.
      - go run . tui --nibs-path "{{.TMP}}/.nibs"

  check:
    desc: Type-check the web UI (svelte-check for src/, tsc for everything else)
    deps: [web:check]

  lint:
    desc: Run golangci-lint
    # The linter runs through `mise exec`, not as a bare `golangci-lint`, so the
    # version mise.toml pins is the one that lints regardless of what else a
    # machine has first on PATH. A bare invocation resolves by PATH order, and a
    # different golangci-lint release disagrees about this codebase — that drift
    # is what mise.toml's header records. mise is the one tool contributors
    # install by hand (see CLAUDE.md), so routing through it rules out no other
    # provisioning path, and it keeps the pinned version in mise.toml alone
    # rather than restating it here.
    #
    # web/dist is the second prerequisite: embed.go embeds it, so without it the
    # package does not load and golangci-lint reports a type-check error about a
    # missing embed pattern rather than anything to do with the code. That only
    # shows up on a cold lint cache — a warm one answers "0 issues" from results
    # it computed when web/dist was still there — so a passing local run is no
    # evidence the checkout is actually lintable. The check is, and it is cheap.
    #
    # Deliberately a precondition rather than `deps: [web:build]`, which is how
    # the other tasks needing web/dist get it: linting should stay fast and not
    # pull in a web build, so this one reports the gap instead of closing it.
    # The mise, mise.toml and web/dist checks are shell builtins in Task's
    # embedded interpreter; the trust check is the one extra process on the
    # success path.
    #
    # Trust is checked separately because `command -v mise` passes on an
    # untrusted checkout — mise is installed and on PATH, it just refuses to read
    # mise.toml. A terminal would get mise's interactive trust prompt here; a CI
    # step, a pre-commit hook or a coding agent gets only the refusal, which is
    # the case this covers. Redirecting mise's output keeps the check from
    # prompting, so both paths get the guided message instead.
    #
    # The 2>&1 is load-bearing, not noise: mise draws the trust prompt on
    # stderr, so >/dev/null alone still prompts on a terminal. Keep both.
    #
    # The check is "mise can load its config", not "the config is trusted" — a
    # malformed mise.toml fails it too, which is why the message names
    # mise config ls as the fallback. It is also not specific to this checkout:
    # `mise config ls` exits 0 on the user's global config alone, so an absent
    # mise.toml would report all-clear while `mise exec` resolves golangci-lint
    # from PATH and the pin goes unapplied. The preceding `test -f` closes that,
    # and stays its own precondition so each message names one cause — folded
    # into the trust check with `&&`, a missing file would be answered by a
    # message whose first advice is `mise trust`, and mise config ls then exits
    # 0 with nothing to show.
    preconditions:
      - sh: command -v mise >/dev/null
        msg: |
          mise is not on PATH.

          golangci-lint is pinned in mise.toml and this task runs it through mise,
          so the pinned version is used whatever else provides a golangci-lint.
          Install mise, then run `mise trust` and `mise install` in this checkout:
            https://mise.jdx.dev/getting-started.html
      - sh: test -f mise.toml
        msg: |
          mise.toml is missing from the repo root, so nothing pins golangci-lint
          for this checkout. `mise exec` would fall back to whatever golangci-lint
          PATH provides — a different release disagrees about this codebase, and
          CI would reach a different verdict. Restore mise.toml from git.
      - sh: mise config ls >/dev/null 2>&1
        msg: |
          mise cannot load this checkout's mise.toml.

          Almost always this means the checkout is not trusted — mise refuses an
          untrusted config, and this task runs golangci-lint through mise. This
          check runs non-interactively, so it reports the refusal rather than
          showing mise's trust prompt — which a CI step, a pre-commit hook or a
          coding agent would never see either. Trust this checkout once:
            mise trust

          If that prints "No untrusted config files found", the config is trusted
          but unreadable for another reason — a malformed mise.toml fails this
          check too. This check discards mise's own error; run `mise config ls`
          to see it.

      - sh: test -d web/dist
        msg: |
          web/dist is missing, and embed.go embeds it — the Go packages will not
          load for the linter. Build the web assets first: task web:build
    cmds:
      - mise exec -- golangci-lint run ./...

  vulncheck:
    desc: Report known vulnerabilities in dependencies (govulncheck, allowlisted)
    # Runs scripts/vulncheck.sh rather than govulncheck directly, because the
    # decision cannot come from govulncheck's exit status: `-format json`, which
    # the gate needs in order to filter, exits 0 even when it reports findings.
    # The gate also fails on an allowlist entry that no longer matches anything,
    # so a suppression cannot quietly outlive its reason.
    #
    # web/dist is a prerequisite for the same reason as lint: embed.go embeds it,
    # so without it the package does not load and govulncheck reports a missing
    # embed pattern rather than anything about dependencies. Kept as a
    # precondition rather than `deps: [web:build]` so the task stays fast and
    # reports the gap instead of silently closing it.
    preconditions:
      - sh: command -v mise >/dev/null
        msg: |
          mise is not on PATH.

          govulncheck is pinned in mise.toml and this task runs it through mise,
          so the pinned version is used whatever else provides a govulncheck.
          Install mise, then run `mise trust` and `mise install` in this checkout:
            https://mise.jdx.dev/getting-started.html
      - sh: command -v jq >/dev/null
        msg: |
          jq is not on PATH. The gate parses govulncheck's JSON output with it.
          A missing jq fails rather than passing: "could not check" and "nothing
          to report" must not look alike.
      - sh: test -d web/dist
        msg: |
          web/dist is missing, so the package embed.go embeds does not load and
          govulncheck would report a missing embed pattern rather than scanning
          dependencies. Build the web assets first:
            task web:build
    cmds:
      - bash scripts/vulncheck.sh

  web:vulncheck:
    desc: Report known advisories in the npm dependency tree (npm audit, allowlisted)
    # The npm-tree half of `vulncheck`, and deliberately its twin: an allowlist
    # with a written rationale per entry, a decision made from parsed JSON, and
    # failure in both directions so a suppression cannot outlive its reason.
    #
    # It exists because the two trees are both shipped surface — embed.go embeds
    # web/dist into the binary, so dompurify, marked, bits-ui, codemirror and the
    # compiled svelte runtime all reach a user's browser — and only one of them
    # had a gate (nibs-uilw).
    #
    # No web:build or web:install precondition, unlike `vulncheck`: npm audit
    # resolves the tree from package-lock.json and queries the registry, so it
    # needs neither node_modules nor a build. That makes it cheap enough to run
    # anywhere, and keeps it off the install path this repo guards carefully.
    preconditions:
      - sh: command -v npm >/dev/null
        msg: |
          npm is not on PATH.

          node is pinned in mise.toml. Install mise, then run `mise trust` and
          `mise install` in this checkout, and make its shims reachable:
            https://mise.jdx.dev/getting-started.html
      - sh: command -v jq >/dev/null
        msg: |
          jq is not on PATH. The gate parses `npm audit --json` with it.
          A missing jq fails rather than passing: "could not check" and "nothing
          to report" must not look alike.
    cmds:
      - bash scripts/web-vulncheck.sh

  release:prep:
    desc: Build everything a release archive needs (web assets, generated code, license notices)
    # This used to live in .goreleaser.yaml's `before.hooks`, and moving it out
    # is a security fix rather than tidying. The release job sets
    # NIBS_SIGNING_KEY on the step that runs goreleaser, and goreleaser's before
    # hooks inherit that environment — so `npm ci`, which executes install and
    # postinstall scripts for every package in web/package-lock.json, ran with
    # the release signing key readable in its environment. Any hostile package
    # in that tree could have taken a key that cannot be revoked for binaries
    # already shipped.
    #
    # Running the same work as its own step, before the key is ever in scope,
    # means the key-bearing process has no third-party children at all.
    #
    # It also closes a hazard CLAUDE.md already recorded: the old hook ran a
    # bare `cd web && npm ci`, outside the web:install gate, which is exactly
    # the hand-run install that has corrupted node_modules here before. Going
    # through web:build routes it back through that gate.
    cmds:
      - task: web:build
      - task: licenses

  licenses:
    desc: Collect third-party dependency licenses
    # Through `mise exec` for the same reason as lint above: go-licenses is
    # pinned in mise.toml, and mise is the one tool contributors install by
    # hand, so this resolves the pinned version whether or not mise's shims are
    # on PATH. It also removes the `go install …@latest` this task used to
    # assume — the version that writes third_party_licenses/ into every
    # published archive is now the one the release job runs (nibs-ag7i).
    cmds:
      - mise exec -- go-licenses save ./... --save_path=./third_party_licenses --force --ignore github.com/alphaleonis/nibs
      - mise exec -- go-licenses report ./... --ignore github.com/alphaleonis/nibs > ./third_party_licenses/NOTICES.csv 2>/dev/null
